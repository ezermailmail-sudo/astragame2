const SPR_H = 120, SPR_W = SPR_H * 186/360;

let best = 0; try { best = +localStorage.getItem('best')||0 } catch(e){}

let P, ravens, parts, sword, score, wave, kills, spawnT, time, running = false, shake = 0;

function reset(){
  P = {x:W/2, y:H/2, hp:5, inv:0, face:1, vx:0, vy:0};
  ravens = []; parts = []; sword = null; score = 0; wave = 1; kills = 0; spawnT = 1; time = 0; shake = 0;
  updHud();
}
function updHud(){
  document.getElementById('hp').textContent = '❤️'.repeat(Math.max(P.hp,0));
  document.getElementById('sc').textContent = 'Волна ' + wave + ' · ' + score;
}

// ---- управление ----
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if(e.code==='Space'){ e.preventDefault(); swing(); } });
addEventListener('keyup', e => keys[e.code] = false);
const joy = {on:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0};
cv.addEventListener('pointerdown', e => { if(joy.on) return; joy.on = true; joy.id = e.pointerId; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; joy.dx = joy.dy = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if(!joy.on || e.pointerId !== joy.id) return;
  joy.x = e.clientX; joy.y = e.clientY;
  let dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx,dy), m = 60;
  if(d > m){ joy.ox = joy.x - dx/d*m; joy.oy = joy.y - dy/d*m; dx = joy.x - joy.ox; dy = joy.y - joy.oy; d = m; }
  joy.dx = dx/m; joy.dy = dy/m;
});
const endJoy = e => { if(e.pointerId === joy.id){ joy.on = false; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
document.getElementById('atk').addEventListener('pointerdown', e => { e.preventDefault(); swing(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// ---- меч ----
function swing(){
  if(!running || sword || P.cd > 0) return;
  // целимся в ближайшего ворона, иначе по направлению взгляда
  let tgt = null, bd = 1e9;
  for(const r of ravens){ const d = Math.hypot(r.x-P.x, r.y-P.y); if(d < bd){ bd = d; tgt = r; } }
  let ang = (tgt && bd < 260) ? Math.atan2(tgt.y-P.y, tgt.x-P.x) : (P.face > 0 ? 0 : Math.PI);
  if(tgt && bd < 260) P.face = Math.cos(ang) >= 0 ? 1 : -1;
  sword = {t:0, dur:.28, ang, hit:new Set()};
  P.cd = .38; buzz('light');
}
const REACH = 125, ARC = Math.PI * 0.9;

// ---- вороны ----
function spawnRaven(){
  const side = Math.floor(Math.random()*4), m = 40; let x, y;
  if(side===0){ x = Math.random()*W; y = -m } else if(side===1){ x = W+m; y = Math.random()*H }
  else if(side===2){ x = Math.random()*W; y = H+m } else { x = -m; y = Math.random()*H }
  ravens.push({x, y, sp: 70 + wave*9 + Math.random()*40, ph: Math.random()*6, wob: 20+Math.random()*30, dir:1});
}
function feathers(x,y,n,col){
  for(let i=0;i<n;i++){ const a = Math.random()*6.28, s = 60+Math.random()*180; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6+Math.random()*.4,c:col,r:Math.random()*6}); }
}

function update(dt){
  time += dt;
  // движение игрока
  let ix = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0) + joy.dx;
  let iy = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0) + joy.dy;
  const l = Math.hypot(ix,iy); if(l > 1){ ix/=l; iy/=l; }
  const sp = 230; P.x += ix*sp*dt; P.y += iy*sp*dt;
  P.x = Math.max(30, Math.min(W-30, P.x)); P.y = Math.max(70, Math.min(H-50, P.y));
  P.moving = l > .1; if(Math.abs(ix) > .2) P.face = ix > 0 ? 1 : -1;
  P.inv = Math.max(0, P.inv - dt); P.cd = Math.max(0, (P.cd||0) - dt);

  // спавн
  spawnT -= dt;
  if(spawnT <= 0){ spawnRaven(); if(wave > 3 && Math.random() < .4) spawnRaven(); spawnT = Math.max(.35, 1.5 - wave*.1); }

  // меч
  if(sword){
    sword.t += dt;
    const k = sword.t / sword.dur, cur = sword.ang - ARC/2 + ARC*k;
    for(const r of ravens){
      if(sword.hit.has(r)) continue;
      const d = Math.hypot(r.x-P.x, r.y-P.y); if(d > REACH + 14) continue;
      let da = Math.atan2(r.y-P.y, r.x-P.x) - sword.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      if(Math.abs(da) <= ARC/2 + .15 && Math.abs(da - (cur - sword.ang)) < .9){ sword.hit.add(r); r.dead = true; }
    }
    if(sword.t >= sword.dur) sword = null;
  }

  // вороны
  for(const r of ravens){
    const a = Math.atan2(P.y-r.y, P.x-r.x), d = Math.hypot(P.x-r.x, P.y-r.y);
    r.ph += dt*14;
    const wob = Math.sin(time*4 + r.ph*.1) * r.wob;
    r.x += (Math.cos(a)*r.sp - Math.sin(a)*wob) * dt; r.y += (Math.sin(a)*r.sp + Math.cos(a)*wob) * dt;
    r.dir = Math.cos(a) >= 0 ? 1 : -1;
    if(!r.dead && d < 30 && P.inv <= 0){
      r.dead = true; P.hp--; P.inv = 1; shake = .25; buzz('heavy'); updHud();
      feathers(P.x,P.y-30,10,'#d33'); if(P.hp <= 0) gameOver();
    }
  }
  for(const r of ravens) if(r.dead && !r.counted){ r.counted = true; if(!(Math.hypot(P.x-r.x,P.y-r.y) < 30 && P.inv > .9)){ score++; kills++; if(kills % 10 === 0) wave++; updHud(); } feathers(r.x,r.y,9,'#222'); feathers(r.x,r.y,4,'#ff9a3c'); }
  ravens = ravens.filter(r => !r.dead);
  for(const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .94; p.vy *= .94; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  shake = Math.max(0, shake - dt);
}

// ---- рисование ----
function drawRaven(r){
  ctx.save(); ctx.translate(r.x, r.y); ctx.scale(r.dir, 1);
  const f = Math.sin(r.ph) * .9;
  ctx.fillStyle = '#15121c';
  for(const s of [-1, 1]){ // крылья
    ctx.save(); ctx.rotate(-.3 + f * s * .5 + (s>0?0:.2));
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(-8, -34*(s>0?1:.7), -30, -28*(s>0?1:.7)); ctx.quadraticCurveTo(-18, -12, 10, -4); ctx.fill(); ctx.restore();
  }
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 10, 0, 0, 6.3); ctx.fill();            // тело
  ctx.beginPath(); ctx.arc(15, -4, 8, 0, 6.3); ctx.fill();                       // голова
  ctx.fillStyle = '#d9a441'; ctx.beginPath(); ctx.moveTo(21,-6); ctx.lineTo(32,-2); ctx.lineTo(21,0); ctx.fill(); // клюв
  ctx.fillStyle = '#ff4a3a'; ctx.beginPath(); ctx.arc(17,-6,2,0,6.3); ctx.fill(); // глаз
  ctx.fillStyle = '#15121c'; ctx.beginPath(); ctx.moveTo(-14,-2); ctx.lineTo(-30,6); ctx.lineTo(-14,6); ctx.fill(); // хвост
  ctx.restore();
}

function draw(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#2a1636'); g.addColorStop(1,'#4a1c1c');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-.5)*8, (Math.random()-.5)*8);
  // плитка поля
  ctx.strokeStyle = '#ffffff0d'; ctx.lineWidth = 1;
  for(let x=0;x<W;x+=60){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=60){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // игрок
  const bob = P.moving ? Math.sin(time*16)*3 : Math.sin(time*3)*1.5;
  ctx.fillStyle = '#0006'; ctx.beginPath(); ctx.ellipse(P.x, P.y+SPR_H/2, 26, 8, 0, 0, 6.3); ctx.fill();
  const flick = P.inv > 0 && Math.floor(time*20)%2 === 0;
  if(!flick){
    ctx.save(); ctx.translate(P.x, P.y + bob); ctx.scale(P.face, 1);
    ctx.drawImage(hero, -SPR_W/2, -SPR_H/2, SPR_W, SPR_H); ctx.restore();
  }

  // меч
  if(sword){
    const k = sword.t / sword.dur, a0 = sword.ang - ARC/2, cur = a0 + ARC*k;
    ctx.save(); ctx.translate(P.x, P.y - 10);
    const gr = ctx.createRadialGradient(0,0,20,0,0,REACH);
    gr.addColorStop(0,'#ffb03a00'); gr.addColorStop(1,'#ffd27acc');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0,0,REACH, Math.max(a0, cur-1.4), cur); ctx.arc(0,0,REACH*.55, cur, Math.max(a0, cur-1.4), true); ctx.fill();
    ctx.rotate(cur); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.shadowColor = '#ff7a1a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(26,0); ctx.lineTo(REACH,0); ctx.stroke();
    ctx.strokeStyle = '#c9a24a'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(30,0); ctx.stroke();
    ctx.restore();
  }

  for(const r of ravens) drawRaven(r);
  for(const p of parts){ ctx.globalAlpha = Math.max(0,p.l); ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(p.x,p.y,5,2,p.r,0,6.3); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // джойстик
  if(joy.on){
    ctx.strokeStyle = '#ffd9a055'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 60, 0, 6.3); ctx.stroke();
    ctx.fillStyle = '#ffd9a066'; ctx.beginPath(); ctx.arc(joy.x, joy.y, 26, 0, 6.3); ctx.fill();
  }
}

// ---- цикл ----
let last = 0;
function loop(t){
  const dt = Math.min(.05, (t - last)/1000 || 0); last = t;
  if(running) update(dt);
  if(P) draw();
  requestAnimationFrame(loop);
}

const ov = document.getElementById('ov'), msg = document.getElementById('msg');
function gameOver(){
  running = false;
  if(score > best){ best = score; try{ localStorage.setItem('best', best) }catch(e){} }
  ov.querySelector('h1').textContent = '💀 Вороны победили';
  msg.textContent = 'Убито воронов: ' + score + ' · Волна ' + wave + ' · Рекорд: ' + best;
  document.getElementById('go').textContent = 'Ещё раз';
  ov.style.display = 'flex';
}
document.getElementById('go').onclick = () => { reset(); ov.style.display = 'none'; running = true; };
reset(); requestAnimationFrame(loop);
</script>
